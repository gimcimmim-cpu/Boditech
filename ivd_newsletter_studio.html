    let state = loadState();

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return JSON.parse(JSON.stringify(DEFAULT_DB));
    }

    function saveState() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
      renderStaffAndKpi();
    }

    function resetToDefault() {
      if (!confirm("수정된 IVD_뉴스_조사항목 및 2611 수집 기준 초기 데이터로 복원하시겠습니까?")) return;
      state = JSON.parse(JSON.stringify(DEFAULT_DB));
      saveState();
      renderAll();
      showToast("초기 데이터(2026.11 개정판)로 복원되었습니다.");
    }

    function showToast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.style.display = "block";
      setTimeout(() => { el.style.display = "none"; }, 2600);
    }

    function esc(s) {
      return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function isBlocked(item) {
      if (item.verify_level === "✕" || item.verify_level === "X" || item.slide_use === "✕") return true;
      const text = (item.title + " " + item.summary + " " + item.company).toLowerCase();
      return BLACKLIST.some(b => text.includes(b.toLowerCase()));
    }

    function getSlideItems() {
      return state.news_items.filter(i => !isBlocked(i) && i.slide_use === "●" && i.selected);
    }

    function runNewsroomQA() {
      const slideItems = getSlideItems();
      const slideEarnings = state.earnings_board.filter(r => r.slide_use === "●");
      const noBoditech = !slideEarnings.some(r => r.company.includes("바디텍") || r.company.toLowerCase().includes("boditech"));
      const noXInSlide = !slideItems.some(i => isBlocked(i));
      const topics = slideItems.filter(i => i.section === "2장-화제");
      const topicsOk = topics.length === 5 && topics.every(t => (t.boditech_insight || "").trim().length > 0);
      const noCjk = !CJK_RE.test(JSON.stringify(state));
      const checks = [
        { role: "김도윤 기자", ok: state.news_items.length > 0 && state.tech_newsletter.length >= 20, label: `취재 ${state.news_items.length}건 · 기술 ${state.tech_newsletter.length}건` },
        { role: "최윤서 팩트체커", ok: state.source_review_table.length >= 10, label: `원문 대조 ${state.source_review_table.length}건 완료` },
        { role: "한서연 편집장", ok: slideItems.length > 0 && topicsOk, label: `2장 편성(1장+화제 ${topics.length}선)` },
        { role: "장성민 검수자", ok: noBoditech && noXInSlide && noCjk, label: `바디텍제외:${noBoditech?'OK':'FAIL'} · ✕차단:${noXInSlide?'OK':'FAIL'} · 한자0건:${noCjk?'OK':'FAIL'}` },
        { role: "박진우 사장", ok: noBoditech && noXInSlide && noCjk && topicsOk, label: (noBoditech && noXInSlide && noCjk && topicsOk) ? "발행 승인 (QA_PASS)" : "보류 (확인 필요)" }
      ];
      return checks;
    }

    async function copyOutlook() {
      const frag = buildPreviewHtml();
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([new ClipboardItem({ "text/html": new Blob([frag], { type: "text/html" }), "text/plain": new Blob([document.getElementById("preview-box").innerText], { type: "text/plain" }) })]);
          showToast("Outlook 메일용 서식 HTML이 복사되었습니다.");
          return;
        }
      } catch (e) {}
      showToast("브라우저 복사 권한 확인 후 다시 시도해 주세요.");
    }

    function downloadFile(name, content, mime) {

    }

    async function pollLiveOfficeStatus() {
      const urls = ["/api/office-status", "./data/office_status.json", "./ivd-newsletter/data/office_status.json"];
      for (const url of urls) {
        try {
          const res = await fetch(url + "?t=" + Date.now(), { cache: "no-store" });
          if (!res.ok) continue;
          const data = await res.json();
          const isApi = url.startsWith("/api/");
          officeState.liveConnected = isApi && !!data.server_connected;
          officeState.pipelineRunning = !!data.pipeline_running || data.state === "running";
          officeState.liveLabel = officeState.liveConnected
            ? (officeState.pipelineRunning ? "LIVE 실시간 작업 중: " + (data.step_label || "") : "LIVE 로컬 서버 연결됨: " + (data.step_label || "대기 중"))
            : "스냅샷 연동: " + (data.step_label || "최근 출판 완료");
          const badge = document.getElementById("office-live-badge");
          if (badge) {
            badge.textContent = officeState.liveLabel;
            badge.style.background = officeState.liveConnected ? (officeState.pipelineRunning ? "#dc2626" : "#059669") : "#475569";
          }
          if (data.updated_at && data.updated_at !== officeState.lastUpdatedAt) {
            officeState.lastUpdatedAt = data.updated_at;
            if (data.mode && ["work", "meeting", "break"].includes(data.mode) && officeState.pipelineRunning) {
              officeState.mode = data.mode;
            }
            officeState.agents.forEach(a => {
              const targetMode = officeState.pipelineRunning ? data.mode : officeState.mode;
              if (targetMode === "meeting") { a.tx = a.meet.x; a.ty = a.meet.y; a.status = "MEETING"; }
              else if (targetMode === "break") { a.tx = a.coffee.x; a.ty = a.coffee.y; a.status = "BREAK"; }
              else { a.tx = a.desk.x; a.ty = a.desk.y; a.status = "WORKING"; }
              if (data.bubbles && data.bubbles[a.id]) {
                a.bubble = data.bubbles[a.id];
                a.bubbleTimer = 280;
              }
              if (data.expressions && data.expressions[a.id]) {
                a.expression = data.expressions[a.id];
              }
              if (data.active_id === a.id && officeState.pipelineRunning) {
                officeState.selectedId = a.id;
              }
            });
            if (Array.isArray(data.logs) && data.logs.length > 0) {
              officeState.logs = [...data.logs].reverse().map(l => esc(l));
              const el = document.getElementById("office-live-feed");
              if (el) el.innerHTML = officeState.logs.map(r => `<div class="office-feed-row">${r}</div>`).join("");
            }
            updateOfficeInspector();
          }
          return;
        } catch (e) {}
      }
    }

              <div style="display:grid; grid-template-columns:1fr; gap:7px;">
                <select id="cmd-target">
                  ${OFFICE_STAFF.map(s => `<option value="${s.id}" ${s.id===officeState.selectedId?'selected':''}>${s.name} (${s.role} · ${s.subagent})</option>`).join("")}
                </select>
                <input type="text" id="cmd-text" placeholder="예: MEDICA 2026 신규 기사 원문 대조해 줘" onkeydown="if(event.key==='Enter') sendDirectorCommand()" />
                <button class="btn btn-primary" onclick="sendDirectorCommand()">지시 전달 &amp; 프롬프트 복사</button>
                <textarea id="cmd-prompt-box" readonly style="font-size:11px; min-height:46px; background:#f8fafc;" placeholder="지시 전달 시 Antigravity/Claude Code용 맞춤 명령 프롬프트가 여기에 생성됩니다."></textarea>
              </div>
            </div>

            <div class="card">
              <h4 style="margin:0 0 6px; font-size:13.5px;">실시간 뉴스룸 활동 로그</h4>
              <div id="office-live-feed" class="office-feed">
                ${officeState.logs.map(r => `<div class="office-feed-row">${r}</div>`).join("")}
              </div>
            </div>
          </div>
        </div>
      `;
      updateOfficeInspector();
      const canvas = document.getElementById("office-canvas");
      canvas.onclick = function(ev) {
        const rect = canvas.getBoundingClientRect();
        const cx = (ev.clientX - rect.left) * (canvas.width / rect.width);
        const cy = (ev.clientY - rect.top) * (canvas.height / rect.height);
        let best = null, bestD = 9999;
        officeState.agents.forEach(a => {
          const d1 = Math.hypot(cx - a.x, cy - a.y);
          const d2 = Math.hypot(cx - a.desk.x, cy - (a.desk.y - 24));
          const d = Math.min(d1, d2);
          if (d < 62 && d < bestD) { bestD = d; best = a; }
        });
        if (best) {
          officeState.selectedId = best.id;
          best.bubbleTimer = 200;
          const sel = document.getElementById("cmd-target");
          if (sel) sel.value = best.id;
          updateOfficeInspector();
          addOfficeLog(best.name, best.bubble);
        }
      };
      startOfficeLoop();
    }

    const SPRITE_CACHE = new Map();

    function getChibiSprite(a, pose, expr, facing) {
      const key = `${a.id}_${pose}_${expr}_${facing}`;
      if (SPRITE_CACHE.has(key)) return SPRITE_CACHE.get(key);

      const SCALE = 2.5;
      const W = 28, H = 36;
      const off = document.createElement("canvas");
      off.width = Math.round(W * SCALE);
      off.height = Math.round(H * SCALE);
      const c = off.getContext("2d");
      c.imageSmoothingEnabled = false;
      c.scale(SCALE, SCALE);
      if (facing < 0) {
        c.translate(W, 0);
        c.scale(-1, 1);
      }

      const cx = 14;
      const isSit = pose === "sitA" || pose === "sitB";
      const bodyY = isSit ? 18 : (pose === "walkA" || pose === "walkB" ? 16 : 17);
      const headY = bodyY - 12;

      function px(x, y, w, h, col) {
        c.fillStyle = col;
        c.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
      }

      // === BODY RIG ===
      if (!isSit) {
        const lOff = pose === "walkA" ? -2 : (pose === "walkB" ? 2 : 0);
        const rOff = pose === "walkA" ? 2 : (pose === "walkB" ? -2 : 0);
        // Legs & shoes
        px(cx - 4, bodyY + 8 + lOff * 0.5, 3, 5, "#1e293b");
        px(cx - 4, bodyY + 12 + lOff * 0.5, 4, 2, "#0f172a");
        px(cx + 1, bodyY + 8 + rOff * 0.5, 3, 5, "#1e293b");
        px(cx + 1, bodyY + 12 + rOff * 0.5, 4, 2, "#0f172a");
      } else {
        // Seated lap
        px(cx - 5, bodyY + 8, 10, 4, "#1e293b");
      }

      // Torso jacket & shirt
      px(cx - 6, bodyY, 12, 9, "#0f172a");
      px(cx - 5, bodyY + 1, 10, 7, a.color);
      // Shirt collar & tie/scarf
      px(cx - 2, bodyY + 1, 4, 2, "#ffffff");
      px(cx - 1, bodyY + 2, 2, 5, a.id === "editor" ? "#f43f5e" : (a.id === "publisher" ? "#facc15" : "#e2e8f0"));

      // Arms
      if (isSit) {
        const typeArmL = pose === "sitA" ? -1 : 0;
        const typeArmR = pose === "sitB" ? -1 : 0;
        px(cx - 7, bodyY + 2 + typeArmL, 2, 4, a.color);
        px(cx - 7, bodyY + 5 + typeArmL, 2, 2, a.skin);
        px(cx + 5, bodyY + 2 + typeArmR, 2, 4, a.color);
        px(cx + 5, bodyY + 5 + typeArmR, 2, 2, a.skin);
      } else if (pose === "rest") {
        px(cx - 7, bodyY + 2, 2, 5, a.color);
        px(cx - 7, bodyY + 6, 2, 2, a.skin);
        px(cx + 5, bodyY + 2, 2, 4, a.color);
        px(cx + 6, bodyY + 4, 2, 2, a.skin);
        // Coffee cup in hand
        px(cx + 7, bodyY + 2, 3, 4, "#ffffff");
        px(cx + 8, bodyY + 3, 1, 1, "#78350f");
      } else {
        const aL = pose === "walkA" ? 2 : (pose === "walkB" ? -2 : 0);
        const aR = pose === "walkA" ? -2 : (pose === "walkB" ? 2 : 0);
        px(cx - 7, bodyY + 2 + aL * 0.5, 2, 5, a.color);
        px(cx - 7, bodyY + 6 + aL * 0.5, 2, 2, a.skin);
        px(cx + 5, bodyY + 2 + aR * 0.5, 2, 5, a.color);
        px(cx + 5, bodyY + 6 + aR * 0.5, 2, 2, a.skin);
      }

      // === HEAD RIG (2-head-tall chibi) ===
      // Back hair for long styles
      if (a.id === "factchecker") {
        px(cx - 7, headY + 2, 14, 10, a.hair);
      } else if (a.id === "editor") {
        px(cx - 9, headY + 3, 3, 7, a.hair);
      }

      // Face rounded outline
      px(cx - 6, headY, 12, 12, "#0f172a");
      px(cx - 7, headY + 2, 14, 9, "#0f172a");
      px(cx - 5, headY + 1, 10, 10, a.skin);
      px(cx - 6, headY + 2, 12, 8, a.skin);

      // Rosy cheeks
      px(cx - 5, headY + 7, 2, 1, "#fda4af");
      px(cx + 3, headY + 7, 2, 1, "#fda4af");

      // Hair cap & bangs
      px(cx - 6, headY - 1, 12, 4, a.hair);
      px(cx - 7, headY + 1, 14, 3, a.hair);
      if (a.id === "reporter") {
        px(cx - 4, headY - 2, 3, 2, a.hair);
        px(cx + 1, headY - 2, 3, 2, a.hair);
        px(cx - 2, headY + 3, 2, 2, a.hair);
      } else if (a.id === "factchecker") {
        px(cx - 6, headY + 3, 2, 7, a.hair);
        px(cx + 4, headY + 3, 2, 7, a.hair);
        px(cx - 3, headY + 3, 6, 1, a.hair);
      } else if (a.id === "editor") {
        px(cx - 4, headY - 2, 8, 2, a.hair);
        px(cx + 1, headY + 3, 3, 2, a.hair);
      } else if (a.id === "qa") {
        px(cx - 1, headY, 1, 3, "#cbd5e1");
        px(cx - 5, headY + 3, 3, 1, a.hair);
      } else {
        // Publisher silver highlight
        px(cx - 4, headY - 2, 8, 2, "#64748b");
        px(cx - 5, headY, 10, 2, a.hair);
      }

      // Expressions
      if (expr === "blink") {
        px(cx - 4, headY + 6, 2, 1, "#0f172a");
        px(cx + 2, headY + 6, 2, 1, "#0f172a");
      } else if (expr === "happy") {
        px(cx - 4, headY + 5, 2, 1, "#0f172a");
        px(cx + 2, headY + 5, 2, 1, "#0f172a");
        px(cx - 1, headY + 8, 2, 1, "#e11d48");
      } else if (expr === "think") {
        px(cx - 4, headY + 5, 2, 2, "#0f172a");
        px(cx + 2, headY + 5, 2, 2, "#0f172a");
        px(cx - 4, headY + 4, 2, 1, "#334155");
        px(cx + 2, headY + 4, 2, 1, "#334155");
      } else {
        px(cx - 4, headY + 5, 2, 2, "#0f172a");
        px(cx + 2, headY + 5, 2, 2, "#0f172a");
        px(cx - 4, headY + 5, 1, 1, "#ffffff");
        px(cx + 2, headY + 5, 1, 1, "#ffffff");
      }

      // Glasses
      if (a.glasses) {
        c.strokeStyle = "#1e293b";
        c.lineWidth = 1;
        c.strokeRect(cx - 5, headY + 4.5, 4, 3);
        c.strokeRect(cx + 1, headY + 4.5, 4, 3);
        px(cx - 1, headY + 5, 2, 1, "#1e293b");
      }

      SPRITE_CACHE.set(key, off);
      return off;
    }

    function drawPixelDesk(ctx, x, y, label, accent, night, monitorText, tick) {
      // Warm wood-bordered studio zone
      ctx.fillStyle = night ? "rgba(15,23,42,0.88)" : "rgba(255,251,235,0.86)";
      ctx.fillRect(x - 108, y - 82, 216, 134);
      ctx.strokeStyle = accent;
      ctx.lineWidth = 2;
      ctx.strokeRect(x - 108, y - 82, 216, 134);

      // Zone header pill
      ctx.fillStyle = accent;
      ctx.fillRect(x - 108, y - 82, 216, 20);
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 11px 'Malgun Gothic', sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(label, x, y - 68);

      // Ergonomic swivel chair
      ctx.fillStyle = "#1e293b";
      ctx.fillRect(x - 14, y - 10, 28, 14);
      ctx.fillStyle = "#334155";
      ctx.fillRect(x - 12, y - 16, 24, 8);

      // 2.5D Shaded Wood Desk
      ctx.fillStyle = "rgba(15,23,42,0.18)";
      ctx.fillRect(x - 58, y - 10, 116, 7);
      ctx.fillStyle = "#78350f";
      ctx.fillRect(x - 56, y - 42, 112, 34);
      ctx.fillStyle = "#b45309";
      ctx.fillRect(x - 54, y - 40, 108, 28);
      ctx.fillStyle = "#f59e0b";
      ctx.fillRect(x - 54, y - 40, 108, 3);

      // Dual Monitors with live scrolling code/article bars
      [-23, 17].forEach((mx, mIdx) => {
        ctx.fillStyle = "#0f172a";
        ctx.fillRect(x + mx - 18, y - 56, 38, 24);
        ctx.fillStyle = "#334155";
        ctx.fillRect(x + mx - 3, y - 32, 8, 4);
        ctx.fillStyle = night ? "#0369a1" : "#1e3a8a";
        ctx.fillRect(x + mx - 15, y - 53, 32, 18);
        const offset = Math.floor((tick / 10 + mIdx * 3) % 4);
        ctx.fillStyle = "#38bdf8";
        ctx.fillRect(x + mx - 13, y - 50 + offset * 3, 18, 2);
        ctx.fillStyle = "#4ade80";
        ctx.fillRect(x + mx - 13, y - 43, 10 + (offset * 3), 2);
        ctx.fillStyle = "#facc15";
        ctx.fillRect(x + mx - 13, y - 38, 22, 2);
      });

      // Keyboard, stack of papers, mug
      ctx.fillStyle = "#334155";
      ctx.fillRect(x - 15, y - 22, 30, 6);
      ctx.fillStyle = "#e2e8f0";
      ctx.fillRect(x - 13, y - 21, 26, 2);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(x - 48, y - 33, 14, 15);
      ctx.fillStyle = "#94a3b8";
      ctx.fillRect(x - 46, y - 30, 10, 2);
      ctx.fillRect(x - 46, y - 26, 8, 2);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(x + 39, y - 29, 7, 8);
      ctx.fillStyle = "#78350f";
      ctx.fillRect(x + 40, y - 28, 5, 2);

      if (night) {
        const grad = ctx.createRadialGradient(x, y - 24, 6, x, y - 24, 88);
        grad.addColorStop(0, "rgba(253, 224, 71, 0.28)");
        grad.addColorStop(1, "rgba(253, 224, 71, 0)");
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(x, y - 24, 88, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawPixelAgent(ctx, a, tick, isSelected) {
      const dx = a.tx - a.x, dy = a.ty - a.y;
      const moving = Math.hypot(dx, dy) > 2;
      if (moving && Math.abs(dx) > 0.5) a.facing = dx >= 0 ? 1 : -1;
      const facing = a.facing || 1;
      const blink = (tick + a.id.length * 41) % 190 < 6;

      let pose = "stand";
      if (moving) pose = (Math.floor(tick / 8) % 2 === 0) ? "walkA" : "walkB";
      else if (a.status === "WORKING" || a.status === "TASK") pose = (Math.floor(tick / 9) % 2 === 0) ? "sitA" : "sitB";
      else if (a.status === "BREAK") pose = "rest";

      let expr = a.expression || "neutral";
      if (blink) expr = "blink";
      else if (a.status === "BREAK") expr = "happy";

      const sprite = getChibiSprite(a, pose, expr, facing);
      const px = Math.round(a.x);
      const py = Math.round(a.y);

      if (isSelected) {
        ctx.strokeStyle = "#facc15";
        ctx.lineWidth = 2;
        ctx.strokeRect(px - 24, py - 58, 48, 72);
      }

      // Soft ellipse shadow
      ctx.fillStyle = "rgba(15,23,42,0.28)";
      ctx.beginPath();
      ctx.ellipse(px, py + 11, 15, 5, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(sprite, Math.round(px - sprite.width / 2), Math.round(py - sprite.height + 13));

      // Rising steam in break mode
      if (a.status === "BREAK") {
        const sy = Math.floor(tick / 12) % 3;
        ctx.fillStyle = "rgba(255,255,255,0.85)";
        ctx.fillRect(px + (facing >= 0 ? 17 : -19), py - 24 - sy * 3, 3, 4);
      }

      // Nameplate
      ctx.fillStyle = "rgba(15,23,42,0.92)";
      ctx.fillRect(px - 30, py + 14, 60, 15);
      ctx.fillStyle = a.color;
      ctx.fillRect(px - 28, py + 17, 6, 9);
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 9.5px 'Malgun Gothic', sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(a.name, px + 3, py + 25);

      // Speech bubble
      if (a.bubble && a.bubbleTimer > 0) {
        ctx.font = "bold 10.5px 'Malgun Gothic', sans-serif";
        const labelTxt = a.bubble.slice(0, 30);
        const tw = Math.min(265, Math.max(94, ctx.measureText(labelTxt).width + 18));
        const bx = Math.max(8, Math.min(960 - tw - 8, px - tw / 2));
        const by = Math.max(6, py - 84);
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(bx, by, tw, 23);
        ctx.strokeStyle = a.color;
        ctx.lineWidth = 2;
        ctx.strokeRect(bx, by, tw, 23);
        ctx.fillStyle = "#ffffff";
        ctx.beginPath(); ctx.moveTo(px - 4, by + 22); ctx.lineTo(px + 4, by + 22); ctx.lineTo(px, by + 28); ctx.closePath(); ctx.fill();
        ctx.fillStyle = "#0f172a";
        ctx.fillText(labelTxt, bx + tw / 2, by + 15);
      }
    }

    function startOfficeLoop() {
      if (officeState.rafId) cancelAnimationFrame(officeState.rafId);
      pollLiveOfficeStatus();
      function frame() {
        const canvas = document.getElementById("office-canvas");
        if (!canvas || !document.getElementById("tab-office").classList.contains("active")) {
          officeState.rafId = null;
          return;
        }
        const ctx = canvas.getContext("2d");
        officeState.tick++;
        if (officeState.tick % 75 === 0) pollLiveOfficeStatus();
        const night = officeState.night;

        // Warm studio wood & concrete tile floor
        ctx.fillStyle = night ? "#0f172a" : "#e5dfd5";
        ctx.fillRect(0, 0, 960, 540);
        for (let gx = 0; gx < 960; gx += 32) {
          for (let gy = 0; gy < 540; gy += 32) {
            if (((gx / 32) + (gy / 32)) % 2 === 0) {
              ctx.fillStyle = night ? "#172136" : "#ede7dd";
              ctx.fillRect(gx, gy, 32, 32);
            }
          }
        }

        // Top studio brick wall & panoramic windows
        ctx.fillStyle = night ? "#1e293b" : "#cbd5e1";
        ctx.fillRect(0, 0, 960, 28);
        for (let wx = 265; wx <= 645; wx += 180) {
          ctx.fillStyle = night ? "#020617" : "#7dd3fc";
          ctx.fillRect(wx, 4, 82, 20);
          ctx.strokeStyle = "#475569"; ctx.lineWidth = 2; ctx.strokeRect(wx, 4, 82, 20);
          if (night) {
            ctx.fillStyle = "#facc15";
            ctx.fillRect(wx + 14, 9, 2, 2);
            ctx.fillRect(wx + 52, 15, 2, 2);
          } else {
            ctx.fillStyle = "rgba(255,255,255,0.8)";
            ctx.fillRect(wx + 12, 9, 18, 4);
            ctx.fillRect(wx + 48, 13, 14, 3);
          }
        }

        // Potted studio plants
        [[278, 52], [676, 52], [295, 495], [665, 495]].forEach(([px, py]) => {
          ctx.fillStyle = "#92400e"; ctx.fillRect(px - 7, py, 14, 12);
          ctx.fillStyle = "#16a34a"; ctx.fillRect(px - 11, py - 14, 22, 15);
          ctx.fillStyle = "#22c55e"; ctx.fillRect(px - 7, py - 18, 14, 8);
        });

        // Draw 5 Desks
        drawPixelDesk(ctx, 145, 125, "취재 데스크 (김도윤)", "#2563eb", night, "RSS", officeState.tick);
        drawPixelDesk(ctx, 480, 115, "편집장 데스크 (한서연)", "#d97706", night, "2CH", officeState.tick);
        drawPixelDesk(ctx, 805, 125, "사장실 (박진우)", "#7c3aed", night, "GO!", officeState.tick);
        drawPixelDesk(ctx, 145, 390, "팩트체크실 (최윤서)", "#059669", night, "DOI", officeState.tick);
        drawPixelDesk(ctx, 805, 390, "QA 검수실 (장성민)", "#475569", night, "QA", officeState.tick);

        // Center Meeting Table + Whiteboard
        ctx.fillStyle = night ? "rgba(30,41,59,0.78)" : "rgba(239,246,255,0.9)";
        ctx.fillRect(330, 192, 300, 170);
        ctx.strokeStyle = "#1d4ed8"; ctx.lineWidth = 2; ctx.strokeRect(330, 192, 300, 170);
        ctx.fillStyle = "#1e3a8a"; ctx.fillRect(330, 192, 300, 20);
        ctx.fillStyle = "#fff"; ctx.font = "bold 11px 'Malgun Gothic', sans-serif"; ctx.textAlign = "center";
        ctx.fillText("중앙 편집회의실 (1장+2장 & 기술 2-1)", 480, 206);
        ctx.fillStyle = "#78350f";
        ctx.beginPath(); ctx.ellipse(480, 280, 88, 36, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#b45309";
        ctx.beginPath(); ctx.ellipse(480, 277, 82, 31, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(450, 270, 16, 12);
        ctx.fillRect(495, 272, 16, 12);
        ctx.fillStyle = "#facc15";
        ctx.fillRect(475, 266, 10, 10);

        // Coffee Lounge (Bottom Center)
        ctx.fillStyle = night ? "#1e293b" : "#fef3c7";
        ctx.fillRect(350, 420, 260, 98);
        ctx.strokeStyle = "#d97706"; ctx.lineWidth = 2; ctx.strokeRect(350, 420, 260, 98);
        ctx.fillStyle = "#92400e"; ctx.font = "bold 11px 'Malgun Gothic', sans-serif";
        ctx.fillText("커피 라운지 (휴게 · 잡담존)", 480, 435);
        ctx.fillStyle = "#334155"; ctx.fillRect(368, 446, 26, 34);
        ctx.fillStyle = "#ef4444"; ctx.fillRect(374, 452, 14, 8);
        ctx.fillStyle = "#0ea5e9"; ctx.fillRect(402, 444, 16, 18);
        ctx.fillStyle = "#f8fafc"; ctx.fillRect(402, 462, 16, 20);
        const cSteam = Math.floor(officeState.tick / 14) % 3;
        ctx.fillStyle = "rgba(255,255,255,0.7)";
        ctx.fillRect(378, 439 - cSteam * 3, 3, 4);
        ctx.fillStyle = "#b91c1c"; ctx.fillRect(515, 484, 52, 18);
        ctx.fillStyle = "#dc2626"; ctx.fillRect(518, 480, 46, 8);
        ctx.fillStyle = "#92400e"; ctx.fillRect(578, 472, 16, 16);
        ctx.fillStyle = "#16a34a"; ctx.fillRect(572, 452, 28, 22);

        // Idle wandering in break mode (only when not live-running)
        if (!officeState.pipelineRunning && officeState.mode === "break" && officeState.tick % 160 === 0) {
          officeState.agents.forEach(a => {
            if (Math.random() < 0.6) {
              a.tx = a.coffee.x + (Math.random() * 44 - 22);
              a.ty = a.coffee.y + (Math.random() * 20 - 10);
            }
          });
        }

        // Meeting Dialogue Sequencer (when not live-running)
        if (!officeState.pipelineRunning && officeState.mode === "meeting") {
          officeState.meetingTimer++;
          if (officeState.meetingTimer % 180 === 1) {
            const line = MEETING_SCRIPT[officeState.meetingStep % MEETING_SCRIPT.length];
            const speaker = officeState.agents.find(a => a.id === line.id);
            if (speaker) {
              speaker.bubble = line.text.split(": ")[1] || line.text;
              speaker.bubbleTimer = 175;
              addOfficeLog(speaker.name + " " + speaker.role, speaker.bubble);
            }
            officeState.meetingStep++;
          }
        }

        // Move & Draw Agents sorted by Y
        officeState.agents.forEach(a => {
          const dx = a.tx - a.x, dy = a.ty - a.y;
          const dist = Math.hypot(dx, dy);
          if (dist > 2) {
            a.x += (dx / dist) * 2.2;
            a.y += (dy / dist) * 2.2;
          } else {
            a.x = a.tx; a.y = a.ty;
          }
          if (a.bubbleTimer > 0) a.bubbleTimer--;
        });

        const sorted = [...officeState.agents].sort((a, b) => a.y - b.y);
        sorted.forEach(a => drawPixelAgent(ctx, a, officeState.tick, a.id === officeState.selectedId));

        officeState.rafId = requestAnimationFrame(frame);
      }
      officeState.rafId = requestAnimationFrame(frame);
    }
    /* ====================================================================== */

    function renderAll() {
      renderStaffAndKpi();
      renderOfficeTab();
    }
    renderAll();
  </script>
